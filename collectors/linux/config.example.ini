[collector]
# HTTPS is mandatory. For a private CA, set ca_cert instead of disabling verification.
api_url = https://monitor.example.com
credential_file = /etc/aasm-collector/credential.json
ca_cert =

queue_path = /var/lib/aasm-collector/queue.db
queue_max_bytes = 268435456
queue_retention_hours = 168

audit_log = /var/log/audit/audit.log
auth_log = /var/log/auth.log
poll_interval_seconds = 1
upload_interval_seconds = 2
heartbeat_interval_seconds = 30
request_timeout_seconds = 10
batch_size = 200
max_batch_bytes = 1500000
command_line_max_length = 512
backoff_initial_seconds = 1
backoff_max_seconds = 300

