services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 1g
    cpus: 1.0
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RULES_PATH: /app/rules
      ASSETS_PATH: /app/assets.yaml
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COLLECTOR_CREDENTIAL_TTL_DAYS: ${COLLECTOR_CREDENTIAL_TTL_DAYS:-365}
      COLLECTOR_MAX_BATCH_SIZE: ${COLLECTOR_MAX_BATCH_SIZE:-500}
      COLLECTOR_MAX_BODY_BYTES: ${COLLECTOR_MAX_BODY_BYTES:-2000000}
      COLLECTOR_MAX_CLOCK_SKEW_SECONDS: ${COLLECTOR_MAX_CLOCK_SKEW_SECONDS:-900}
      COLLECTOR_RATE_LIMIT_PER_MINUTE: ${COLLECTOR_RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose: ["80"]
    networks: [internal]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE}:/etc/nginx/server.crt:ro
      - ${TLS_KEY_FILE}:/etc/nginx/server.key:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
